name: Windows Desktop
on:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Screen
        run: |
          try { Set-DisplayResolution -Width 1366 -Height 768 -Force } catch { Write-Host "resolution: $_" }
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution,CurrentVerticalResolution | Format-List
          "RAM GB: " + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)
      - name: VNC server (TightVNC)
        run: |
          $pw = "${{ secrets.VNC_PASSWORD }}"
          Invoke-WebRequest "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi" -OutFile "$env:TEMP\tvnc.msi"
          Start-Process msiexec.exe -Wait -ArgumentList "/i","$env:TEMP\tvnc.msi","/quiet","/norestart","ADDLOCAL=Server","SERVER_REGISTER_AS_SERVICE=1","SERVER_ADD_FIREWALL_EXCEPTION=1","SET_USEVNCAUTHENTICATION=1","VALUE_OF_USEVNCAUTHENTICATION=1","SET_PASSWORD=1","VALUE_OF_PASSWORD=$pw","SET_ALLOWLOOPBACK=1","VALUE_OF_ALLOWLOOPBACK=1","SET_ACCEPTHTTPCONNECTIONS=1","VALUE_OF_ACCEPTHTTPCONNECTIONS=0"
          Start-Sleep 5
          Get-Service tvnserver
      - name: noVNC web client
        run: |
          python -m pip install -q websockify
          git clone -q --depth 1 https://github.com/novnc/noVNC.git C:\novnc
          Copy-Item C:\novnc\vnc.html C:\novnc\index.html
          Start-Process python -ArgumentList "-m","websockify","--web","C:\novnc","6080","127.0.0.1:5900" -WindowStyle Hidden
      - name: AI agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install -q pyautogui pyperclip pillow requests
          New-Item -ItemType Directory -Force C:\agent | Out-Null
          Copy-Item agent.py C:\agent\agent.py
          Set-Content -Path C:\agent\key.txt -Value $env:GEMINI_API_KEY -NoNewline
          $pyw = (Get-Command python).Source -replace 'python\.exe$','pythonw.exe'
          $ws = New-Object -ComObject WScript.Shell
          foreach ($d in @([Environment]::GetFolderPath("Desktop"), "C:\Users\Public\Desktop")) {
            $s = $ws.CreateShortcut("$d\AI Agent.lnk"); $s.TargetPath = $pyw; $s.Arguments = "C:\agent\agent.py"; $s.WorkingDirectory = "C:\agent"; $s.Save()
          }
          Start-Process $pyw -ArgumentList "C:\agent\agent.py" -WorkingDirectory C:\agent
      - name: Desktop link + keep alive
        env:
          LINK_TOKEN: ${{ secrets.LINK_TOKEN }}
          LINK_REPO: ${{ secrets.LINK_REPO }}
        run: |
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile C:\cf.exe
          $h = @{ Authorization = "Bearer $env:LINK_TOKEN"; Accept = "application/vnd.github+json" }
          $api = "https://api.github.com/repos/$env:LINK_REPO/contents/link.txt"
          function Start-Tunnel {
            Remove-Item C:\cf.log -ErrorAction SilentlyContinue
            Start-Process C:\cf.exe -ArgumentList "tunnel","--no-autoupdate","--logfile","C:\cf.log","--url","http://127.0.0.1:6080" -WindowStyle Hidden
            $url = $null
            for ($i=0; $i -lt 90 -and -not $url; $i++) { Start-Sleep 2; $m = Select-String -Path C:\cf.log -Pattern "https://[a-z0-9-]+\.trycloudflare\.com" -ErrorAction SilentlyContinue | Select-Object -First 1; if ($m) { $url = $m.Matches[0].Value } }
            $link = "$url/vnc.html?autoconnect=1&resize=scale"
            $txt = "$link`nrun $env:GITHUB_RUN_ID`nstarted $((Get-Date).ToUniversalTime().ToString('u'))`n"
            $body = @{ message = "link"; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($txt)) }
            try { $body.sha = (Invoke-RestMethod $api -Headers $h).sha } catch {}
            try { Invoke-RestMethod $api -Method Put -Headers $h -Body ($body | ConvertTo-Json) | Out-Null; Write-Host "link published" } catch { Write-Host "publish failed: $_" }
          }
          Start-Tunnel
          $n = 0
          while ($true) {
            Start-Sleep 60; $n++
            if (-not (Get-Process cf -ErrorAction SilentlyContinue)) { Write-Host "tunnel died, restarting"; Start-Tunnel }
            if (-not (Get-Process pythonw -ErrorAction SilentlyContinue) -and -not (Test-Path C:\agent\closed)) { }
            if ($n % 5 -eq 0) { Write-Host "alive $(Get-Date)" }
          }
